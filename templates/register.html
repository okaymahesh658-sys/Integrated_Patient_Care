{% extends "base.html" %}
{% block content %}
<div style="max-width: 550px; margin: 2rem auto;">
    <div class="card">
        <h2 style="font-size: 1.5rem; font-weight: 700; color: #0369a1; margin-bottom: 1.5rem; text-align: center;">User Registration</h2>

        <form action="/register" method="POST">
            <div style="margin-bottom: 1rem;">
                <label style="display: block; font-size: 0.85rem; font-weight: 600; margin-bottom: 0.35rem;">Full Name *</label>
                <input type="text" name="full_name" placeholder="e.g. Rahul Kumar" required style="width: 100%; padding: 0.75rem; border: 1px solid #cbd5e1; border-radius: 8px;">
            </div>

            <div style="margin-bottom: 1rem;">
                <label style="display: block; font-size: 0.85rem; font-weight: 600; margin-bottom: 0.35rem;">Email Address *</label>
                <input type="email" name="email" placeholder="e.g. rahul@example.com" required style="width: 100%; padding: 0.75rem; border: 1px solid #cbd5e1; border-radius: 8px;">
            </div>

            <div style="margin-bottom: 1rem;">
                <label style="display: block; font-size: 0.85rem; font-weight: 600; margin-bottom: 0.35rem;">Phone Number *</label>
                <input type="text" name="phone" placeholder="e.g. 9876543210" required style="width: 100%; padding: 0.75rem; border: 1px solid #cbd5e1; border-radius: 8px;">
            </div>

            <div style="margin-bottom: 1rem;">
                <label style="display: block; font-size: 0.85rem; font-weight: 600; margin-bottom: 0.35rem;">User Role *</label>
                <select name="role" required style="width: 100%; padding: 0.75rem; border: 1px solid #cbd5e1; border-radius: 8px;">
                    <option value="Patient" selected>Patient</option>
                    <option value="Doctor">Doctor</option>
                    <option value="Nurse">Nurse</option>
                    <option value="Admin">Admin</option>
                </select>
            </div>

            <div style="margin-bottom: 1.5rem;">
                <label style="display: block; font-size: 0.85rem; font-weight: 600; margin-bottom: 0.35rem;">Password *</label>
                <input type="password" name="password" required style="width: 100%; padding: 0.75rem; border: 1px solid #cbd5e1; border-radius: 8px;">
            </div>

            <button type="submit" class="btn btn-primary" style="width: 100%; justify-content: center; padding: 0.85rem;"><i class="fa-solid fa-user-plus"></i> Register Account</button>
        </form>

        <div style="text-align: center; margin-top: 1.5rem;">
            <a href="/login" style="color: #64748b; font-size: 0.9rem;">Already registered? Login here</a>
        </div>
    </div>
</div>
{% endblock %}
